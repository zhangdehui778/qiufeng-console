      - name: Build with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          gradle assembleDebug --no-daemon --stacktrace --console=plain > build.log 2>&1
          RC=$?
          echo "----- 关键错误（只看这段就够）-----"
          grep -n -A 25 "What went wrong" build.log | tail -n 120
          echo "----- 错误行摘要 -----"
          grep -nE "^e: |error: |FAILED|Could not (resolve|find|get resource)" build.log | tail -n 40
          exit $RC
        continue-on-error: true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
