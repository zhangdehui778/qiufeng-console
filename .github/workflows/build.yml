name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > build.log 2>&1
          RC=$?
          set -e
          echo "===== WHAT WENT WRONG ====="
          grep -n -A 25 "What went wrong" build.log | tail -n 120
          echo "===== ERROR LINES ====="
          grep -nE "^e: |error: |FAILED|Could not (resolve|find|get resource)" build.log | tail -n 40
          echo "===== TAIL 40 ====="
          tail -n 40 build.log
          exit $RC

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qiufeng-apk
          path: app/build/outputs/apk/debug/*.apk
